[package]
name = "prompt-builder-for-sidebar-ai"
version = "0.2.0"
edition = "2021"
license = "MIT"
authors = ["kako-jun"]
repository = "https://github.com/kako-jun/prompt-builder-for-sidebar-ai"
description = "A local browser that builds prompts for sidebar AI from your files."

[dependencies]
axum = "0.8.9"
base64 = "0.22"
clap = { version = "4.6.1", features = ["derive"] }
ignore = "0.4.27"
open = "5.3.6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "signal", "net", "io-util"] }
uuid = { version = "1.23.4", features = ["v4"] }
